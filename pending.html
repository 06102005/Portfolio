<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar">
    <div class="logo">My To-Do App</div>
    <ul class="nav-links">
      <li><a href="addtask.html">Add Task</a></li>
      <li><a href="pending.html" class="active">Pending</a></li>
      <li><a href="finished.html">Finished</a></li>
    </ul>
  </nav>

  <section class="todo">
    <div class="container">
      <h1>Pending Tasks</h1>
      <ul id="taskList"></ul>
    </div>
  </section>

  <script>
    const taskList = document.getElementById("taskList");

    function loadTasks() {
      const pendingTasks = JSON.parse(localStorage.getItem("pendingTasks")) || [];
      taskList.innerHTML = "";

      if (pendingTasks.length === 0) {
        taskList.innerHTML = "<p>No pending tasks 🎉</p>";
        return;
      }

      pendingTasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${task.text} — Due: ${task.date || "No date"} ${task.time || ""}</span>
          <button class="complete-btn">Mark as Done</button>
        `;

        li.querySelector(".complete-btn").addEventListener("click", () => {
          markAsFinished(index);
        });

        taskList.appendChild(li);
      });
    }

    function markAsFinished(index) {
      const pendingTasks = JSON.parse(localStorage.getItem("pendingTasks")) || [];
      const finishedTasks = JSON.parse(localStorage.getItem("finishedTasks")) || [];

      finishedTasks.push(pendingTasks[index]);
      pendingTasks.splice(index, 1);

      localStorage.setItem("pendingTasks", JSON.stringify(pendingTasks));
      localStorage.setItem("finishedTasks", JSON.stringify(finishedTasks));

      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
